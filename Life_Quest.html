<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>冒険の書</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-area">
      <div class="book-closed" id="book-closed">
        <img src="assets/book-cover.png" alt="冒険の書（クリックして開く）" class="book-cover-img" />
        <div class="book-open-hint">クリックして開く</div>
      </div>

      <div class="book-open hidden" id="book-open">
        <button id="close-book-btn" class="close-book-btn">✕ 書を閉じる</button>
        <nav class="tabs">
          <button class="tab-button" data-screen="goal">① 目標設定</button>
          <button class="tab-button" data-screen="log">② 活動記録</button>
          <button class="tab-button" data-screen="history">③ 履歴</button>
          <button class="tab-button" data-screen="reset">④ リセット</button>
        </nav>
        <section id="screen-content" class="screen-content"></section>
      </div>
    </main>

    <aside class="right-column">
      <div class="widget-box streak-widget-box" id="streak-widget"></div>
      <div class="widget-box calendar-widget-box" id="calendar-widget"></div>
    </aside>
  </div>

  <button type="button" id="backup-fab-btn" class="backup-fab-btn">データのバックアップ</button>

  <div id="levelup-overlay" class="levelup-overlay hidden">
    <div class="levelup-box">
      <div class="levelup-title">LEVEL UP!</div>
      <div id="levelup-detail" class="levelup-detail"></div>
    </div>
  </div>

  <div id="status-edit-overlay" class="modal-overlay hidden">
    <div class="modal-box" id="status-edit-box"></div>
  </div>

  <div id="status-edit-confirm-overlay" class="modal-overlay hidden">
    <div class="modal-box" id="status-edit-confirm-box"></div>
  </div>

  <div id="job-browser-overlay" class="modal-overlay job-browser-overlay hidden">
    <div class="modal-box" id="job-browser-box"></div>
  </div>

  <div id="reset-confirm-overlay" class="modal-overlay hidden">
    <div class="modal-box" id="reset-confirm-box"></div>
  </div>

  <div id="day-detail-overlay" class="modal-overlay hidden">
    <div class="modal-box" id="day-detail-box"></div>
  </div>

  <div id="tag-picker-overlay" class="modal-overlay tag-picker-overlay hidden">
    <div class="modal-box" id="tag-picker-box"></div>
  </div>

  <div id="backup-overlay" class="modal-overlay hidden">
    <div class="modal-box" id="backup-box"></div>
  </div>

  <div id="character-status-overlay" class="modal-overlay hidden">
    <div class="modal-box character-status-box" id="character-status-box"></div>
  </div>

  <div id="calendar-popup-overlay" class="modal-overlay hidden">
    <div class="modal-box calendar-popup-box" id="calendar-popup-box"></div>
  </div>

  <div id="quest-board-overlay" class="modal-overlay hidden">
    <div class="modal-box quest-board-box" id="quest-board-box"></div>
  </div>

  <script src="js/config.example.js"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/tags.js"></script>
  <script src="js/sprite.js"></script>
  <script src="js/jobs.js"></script>
  <script src="js/character.js"></script>
  <script src="js/jobModal.js"></script>
  <script src="js/tagPickerModal.js"></script>
  <script src="js/statusEditModal.js"></script>
  <script src="js/questBoardModal.js"></script>
  <script src="js/goalScreen.js"></script>
  <script src="js/logScreen.js"></script>
  <script src="js/historyScreen.js"></script>
  <script src="js/resetScreen.js"></script>
  <script src="js/dayDetailModal.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
